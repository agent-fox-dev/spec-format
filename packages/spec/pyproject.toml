[project]
name = "spec"
version = "1.4.1"
description = "CLI for AI-powered spec creation"
requires-python = ">=3.12"
dependencies = [
    "afspec>=1.4.1",
    "agentspec>=1.4.1",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.13",
]

[project.scripts]
spec = "spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afspec = { workspace = true }
agentspec = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
