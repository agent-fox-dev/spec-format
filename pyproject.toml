[project]
name = "spec-format"
version = "1.3.1"
description = "Specification format and CLI for AI-powered spec creation"
requires-python = ">=3.12"
dependencies = [
    "afspec",
    "agentspec",
    "spec",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.uv.sources]
afspec = { workspace = true }
agentspec = { workspace = true }
spec = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
